.btn.tq{background:var(--tq);color:#fff}.btn.ol{background:none;color:var(--tx);border:1px solid var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:30px 0}
.card{background:var(--bg2);padding:24px;border-top:3px solid var(--wd)}
.ph{aspect-ratio:4/3;background:repeating-linear-gradient(45deg,var(--tqs),var(--tqs) 10px,var(--bg2) 10px,var(--bg2) 20px);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px}
.promo{background:var(--tx);color:var(--bg);padding:22px;text-align:center;margin:30px 0}.promo b{color:var(--tq)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 26px}
.tabs button{background:none;border:1px solid var(--ln);color:var(--tx);padding:6px 14px;cursor:pointer;border-radius:20px;font-size:14px}.tabs button.on{background:var(--tq);border-color:var(--tq);color:#fff}
.it{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);align-items:flex-start}
.it .n{flex:1}.it strong{letter-spacing:.06em;text-transform:uppercase;font-size:14px}.it small{display:block;color:var(--mut)}
.pr{color:var(--tq);font-weight:500;white-space:nowrap}
.add{width:32px;height:32px;border-radius:50%;border:1px solid var(--tq);background:none;color:var(--tq);font-size:20px;cursor:pointer;line-height:1}.add:hover{background:var(--tq);color:#fff}
.note{color:var(--mut);font-size:13px;margin-top:20px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin:4px 0 14px;font:inherit}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0}.tot{border-top:2px solid var(--tx);font-weight:500;margin-top:8px;padding-top:10px}
.q button{width:26px;height:26px;border:1px solid var(--ln);background:none;color:var(--tx);cursor:pointer}
footer{border-top:1px solid var(--ln);padding:24px 20px;text-align:center;color:var(--mut);font-size:13px}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tq);color:#fff;padding:12px 18px;border-radius:30px;text-decoration:none;font-size:14px;display:none;box-shadow:0 4px 14px #0003}
</style></head><body>
